<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <meta name="theme-color" content="#060613">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Jarvis</title>
</head>
<body>
<div id="app" data-state="idle">

  <header>
    <div class="header-left">
      <div class="orb-dot" id="orbDot"></div>
      <span class="wordmark">JARVIS</span>
      <span class="status-badge" id="statusText">офлайн</span>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="btnSkills" title="Скиллы">🧩</button>
      <button class="icon-btn" id="btnSettings" title="Настройки">⚙</button>
    </div>
  </header>

  <!-- НАСТРОЙКИ -->
  <div class="side-panel" id="settingsPanel" hidden>
    <div class="side-panel-title">Настройки</div>

    <div class="section-label">🧠 Языковая модель (GGUF)</div>
    <p class="hint">Скачай модель отдельно, открой здесь — сохранится в памяти приложения</p>
    <div class="row-btns">
      <button class="btn-primary" id="pickModelBtn">📂 Открыть файл</button>
      <button class="btn-danger sm" id="clearModelBtn" title="Удалить">✕</button>
    </div>
    <input type="file" id="modelFilePicker" hidden>
    <div class="progress-wrap" id="modelProgressWrap" hidden>
      <div class="progress-bar"><div class="progress-fill" id="modelProgressFill"></div></div>
      <div class="progress-lbl" id="modelProgressLabel"></div>
    </div>
    <div class="status-line" id="modelStatus"></div>
    <p class="hint links">
      Скачать:
      <a href="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" target="_blank">Qwen 0.5B</a> ·
      <a href="https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf" target="_blank">Qwen 1.5B</a>
    </p>

    <div class="section-label">🔊 Офлайн голос</div>
    <p class="hint">Русский TTS без Safari, работает на Android</p>
    <button class="btn-primary" id="ttsBtn">⬇ Загрузить голос (~270 МБ)</button>
    <div class="progress-wrap" id="ttsProgressWrap" hidden>
      <div class="progress-bar"><div class="progress-fill" id="ttsProgressFill"></div></div>
      <div class="progress-lbl" id="ttsProgressLabel"></div>
    </div>
    <div class="status-line" id="ttsStatus"></div>

    <div class="section-label">💾 Данные</div>
    <button class="btn-danger full" id="clearHistoryBtn">🗑 Очистить историю чата</button>
  </div>

  <!-- СКИЛЛЫ -->
  <div class="side-panel" id="skillsPanel" hidden>
    <div class="side-panel-title">
      Скиллы
      <button class="btn-sm-accent" id="addSkillBtn">＋ Новый</button>
    </div>
    <div id="skillsList"></div>
    <div class="skill-form" id="skillForm" hidden>
      <input id="sName"    class="field" placeholder="Название скилла">
      <input id="sTrigger" class="field" placeholder="Триггеры: найди, поищи, search">
      <textarea id="sCode" class="field code-field"
        placeholder="Тело функции (можно async):&#10;const q = input.replace(/найди/gi,'').trim();&#10;window.open('https://duckduckgo.com/?q='+encodeURIComponent(q));&#10;return 'Ищу: '+q;"></textarea>
      <div class="row-btns">
        <button class="btn-primary" id="saveSkillBtn">💾 Сохранить</button>
        <button class="btn-ghost"   id="cancelSkillBtn">Отмена</button>
      </div>
    </div>
  </div>

  <main>
    <div class="chat" id="chat"></div>
  </main>

  <footer>
    <div class="input-row">
      <textarea id="textInput" class="text-input"
                placeholder="Сообщение..." rows="1"></textarea>
      <button class="mic-btn" id="micBtn">🎤</button>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
    <div class="state-lbl" id="stateLbl"></div>
  </footer>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
